<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos Ledger</title>
    <style>
        body { background-color: #0f1113; color: #d1d5db; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #orb { width: 220px; height: 220px; border-radius: 50%; border: 1px solid #6366f1; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(99, 102, 241, 0.3); margin-bottom: 20px; }
        .balance { font-size: 3rem; font-weight: bold; color: #818cf8; margin: 5px 0; }
        .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: #6b7280; }
        .controls { display: flex; flex-direction: column; width: 80%; max-width: 300px; }
        button { background: #1a202c; color: #4fd1c5; border: 1px solid #4fd1c5; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        button.mint { background: #6366f1; color: white; border: none; font-weight: bold; box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        button.pay { color: #f87171; border-color: #f87171; }
        #status { font-size: 0.7rem; color: #9ca3af; text-align: center; margin-top: 5px; padding: 0 20px; }
    </style>
</head>
<body>

    <div id="orb">
        <div class="label">Current Life</div>
        <div class="balance" id="balanceDisplay">--</div>
        <div class="label">Chronos</div>
    </div>

    <div class="controls">
        <button onclick="receiveTime()">Receive Time (+1)</button>
        <button class="pay" onclick="payTime()">Pay Time (-1)</button>
        <button class="mint" onclick="mintToChain()">Mint to Chain (Convert to Cash)</button>
    </div>
    
    <div id="status">Secure Vault Active.</div>

    <script>
        const GENESIS_DEPOSIT = 24.0;
        const CEILING = 2000.0;

        function init() {
            let bal = localStorage.getItem('chronos_bal');
            if (bal === null) {
                localStorage.setItem('chronos_bal', GENESIS_DEPOSIT);
                bal = GENESIS_DEPOSIT;
            }
            document.getElementById('balanceDisplay').innerText = parseFloat(bal).toFixed(1);
        }

        function receiveTime() {
            let current = parseFloat(localStorage.getItem('chronos_bal'));
            if (current < CEILING) {
                current += 1.0;
                localStorage.setItem('chronos_bal', current);
                updateDisplay("Time added to local ledger.");
            }
        }

        function payTime() {
            let current = parseFloat(localStorage.getItem('chronos_bal'));
            if (current >= 1.0) {
                current -= 1.0;
                localStorage.setItem('chronos_bal', current);
                updateDisplay("Time spent.");
            }
        }

        // THE CASH BRIDGE LOGIC
        function mintToChain() {
            let current = parseFloat(localStorage.getItem('chronos_bal'));
            if (current >= 1.0) {
                const confirmed = confirm("Are you sure? This will remove 1 hour from your phone and attempt to mint it as a tradable Crypto Token.");
                if (confirmed) {
                    // Logic: Subtract from app to 'send' to the blockchain
                    current -= 1.0;
                    localStorage.setItem('chronos_bal', current);
                    updateDisplay("MINTING... Connect your MetaMask wallet to claim your cashable tokens.");
                    
                    // In a production environment, this would trigger a Web3 transaction
                    console.log("Web3 Bridge Triggered: Minting 1 ChronoToken.");
                }
            } else {
                updateDisplay("Insufficient balance to mint.");
            }
        }

        function updateDisplay(msg) {
            document.getElementById('balanceDisplay').innerText = parseFloat(localStorage.getItem('chronos_bal')).toFixed(1);
            document.getElementById('status').innerText = msg;
        }

        init();
    </script>
</body>
</html>
