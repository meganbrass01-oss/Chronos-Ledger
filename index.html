<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Ledger</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js" type="application/javascript"></script>
    <style>
        body { background-color: #050505; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .ledger-circle { width: 260px; height: 260px; border: 2px solid #00ffcc; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 25px #00ffcc; margin-bottom: 30px; }
        .balance { font-size: 3.5rem; font-weight: bold; }
        .label { font-size: 0.7rem; letter-spacing: 3px; margin: 10px 0; }
        .status-box { border: 1px solid #00ffcc; padding: 20px; width: 85%; max-width: 400px; text-align: center; background: rgba(0, 255, 204, 0.05); }
        button { background: #00ffcc; border: none; color: #050505; padding: 15px; cursor: pointer; font-family: inherit; width: 100%; font-weight: bold; margin-top: 10px; text-transform: uppercase; }
        #walletStatus { font-size: 0.65rem; color: #66ffcc; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="walletStatus">STATUS: DISCONNECTED</div>
    
    <div class="ledger-circle">
        <div class="label">VAULT BALANCE</div>
        <div class="balance" id="balanceDisplay">0.0</div>
        <div class="label">CHRONOS HRS</div>
    </div>

    <div class="status-box">
        <div id="systemMessage">SYSTEM READY</div>
        <button id="connectBtn" onclick="connectWallet()">ACTIVATE SECURE LINK</button>
        <button id="deployBtn" onclick="deployLedger()" style="display:none;">MINT 24.0 HRS</button>
    </div>

    <script>
        let provider, signer, myAddress;

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    myAddress = accounts[0];
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();

                    document.getElementById('walletStatus').innerText = "CONNECTED: " + myAddress;
                    document.getElementById('connectBtn').style.display = 'none';
                    document.getElementById('deployBtn').style.display = 'block';
                    document.getElementById('systemMessage').innerText = "LINK ESTABLISHED.";
                } catch (e) {
                    document.getElementById('systemMessage').innerText = "CONNECTION ERROR.";
                }
            }
        }

        async function deployLedger() {
            try {
                document.getElementById('systemMessage').innerText = "OPENING METAMASK...";
                
                // This is the REAL command that forces the popup
                const tx = {
                    to: myAddress, 
                    value: ethers.utils.parseEther("0.0"), // A safety check transaction
                    data: "0x" // This will be replaced by your token code in the next step
                };

                const transaction = await signer.sendTransaction(tx);
                document.getElementById('systemMessage').innerText = "MINTING IN PROGRESS...";
                
                await transaction.wait();
                document.getElementById('balanceDisplay').innerText = "24.0";
                document.getElementById('systemMessage').innerText = "MINT SUCCESSFUL!";
                
            } catch (error) {
                document.getElementById('systemMessage').innerText = "MINT CANCELLED OR FAILED.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
