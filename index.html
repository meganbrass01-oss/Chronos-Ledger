<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Ledger</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js" type="application/javascript"></script>
    <style>
        body { background-color: #050505; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .ledger-circle { width: 250px; height: 250px; border: 2px solid #00ffcc; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 20px #00ffcc; margin-bottom: 30px; }
        .balance { font-size: 3rem; font-weight: bold; }
        .label { font-size: 0.8rem; letter-spacing: 2px; margin-top: 10px; }
        .status-box { border: 1px solid #00ffcc; padding: 15px; width: 80%; max-width: 400px; text-align: center; background: rgba(0, 255, 204, 0.05); }
        button { background: transparent; border: 1px solid #00ffcc; color: #00ffcc; padding: 10px 20px; cursor: pointer; font-family: inherit; margin-top: 10px; width: 100%; transition: 0.3s; }
        button:hover { background: #00ffcc; color: #050505; }
        #walletStatus { font-size: 0.7rem; color: #66ffcc; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="walletStatus">Wallet: Disconnected</div>
    
    <div class="ledger-circle">
        <div class="label">LEDGER BALANCE</div>
        <div class="balance" id="balanceDisplay">0.0</div>
        <div class="label">CHRONOS</div>
    </div>

    <div class="status-box">
        <div id="systemMessage">Secure System Ready.</div>
        <button id="connectBtn" onclick="connectWallet()">1. CONNECT WALLET</button>
        <button id="deployBtn" onclick="deployLedger()" style="display:none;">2. DEPLOY LEDGER</button>
    </div>

    <script>
        let provider, signer, myAddress;

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // Force a fresh request for the ACTIVE account only
                    const accounts = await window.ethereum.request({ 
                        method: 'eth_requestAccounts' 
                    });
                    
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    myAddress = accounts[0];

                    // Update UI
                    document.getElementById('walletStatus').innerText = "Connected: " + myAddress.substring(0,6) + "..." + myAddress.substring(38);
                    document.getElementById('connectBtn').style.display = 'none';
                    document.getElementById('deployBtn').style.display = 'block';
                    document.getElementById('systemMessage').innerText = "Identity Verified. Ready for Deployment.";
                    
                } catch (error) {
                    console.error(error);
                    document.getElementById('systemMessage').innerText = "Connection Rejected. Try Again.";
                }
            } else {
                alert("Please open this page inside the MetaMask Explore browser.");
            }
        }

        function deployLedger() {
            document.getElementById('systemMessage').innerText = "Deploying to Polygon...";
            // We will add the actual minting logic once the connection is stable.
            setTimeout(() => {
                document.getElementById('systemMessage').innerText = "Contract Pending on Chain...";
            }, 2000);
        }
    </script>
</body>
</html>
